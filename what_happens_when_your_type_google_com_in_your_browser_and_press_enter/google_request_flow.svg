<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Flow of an HTTPS request to www.google.com</title>
  <desc id="desc">Diagram showing DNS resolution, TCP/IP routing to port 443, encrypted HTTPS traffic through a firewall, load balancing, web server, application server, and database.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243b53"/>
    </marker>
    <marker id="green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#157f3f"/>
    </marker>
    <marker id="lock-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #243b53; stroke-width: 2.5; rx: 8; }
      .network { fill: #e0f2fe; stroke: #0369a1; }
      .security { fill: #fef3c7; stroke: #b45309; }
      .server { fill: #eef2ff; stroke: #4338ca; }
      .db { fill: #ecfdf5; stroke: #047857; }
      .title { font: 700 30px Arial, sans-serif; fill: #102a43; }
      .label { font: 700 18px Arial, sans-serif; fill: #102a43; }
      .small { font: 15px Arial, sans-serif; fill: #334e68; }
      .step { font: 14px Arial, sans-serif; fill: #243b53; }
      .dns { stroke: #157f3f; stroke-width: 3; fill: none; marker-end: url(#green-arrow); }
      .flow { stroke: #243b53; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tls { stroke: #7c3aed; stroke-width: 3.5; fill: none; marker-end: url(#lock-arrow); stroke-dasharray: 9 7; }
      .return { stroke: #243b53; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="780"/>
  <text class="title" x="48" y="52">What happens when you type https://www.google.com and press Enter</text>
  <text class="small" x="50" y="82">The request is resolved, routed, encrypted, filtered, balanced, served, generated, and backed by data.</text>

  <rect class="box" x="50" y="145" width="180" height="104"/>
  <text class="label" x="88" y="187">Browser</text>
  <text class="small" x="78" y="216">Client request</text>

  <rect class="box network" x="320" y="120" width="190" height="94"/>
  <text class="label" x="352" y="158">DNS Resolver</text>
  <text class="small" x="355" y="187">Finds server IP</text>

  <rect class="box network" x="610" y="120" width="210" height="94"/>
  <text class="label" x="643" y="158">Authoritative DNS</text>
  <text class="small" x="652" y="187">Returns address</text>

  <rect class="box network" x="320" y="330" width="210" height="104"/>
  <text class="label" x="375" y="372">Internet</text>
  <text class="small" x="356" y="403">TCP/IP routing</text>

  <rect class="box security" x="610" y="330" width="180" height="104"/>
  <text class="label" x="666" y="372">Firewall</text>
  <text class="small" x="648" y="403">Allows TCP 443</text>

  <rect class="box server" x="870" y="330" width="190" height="104"/>
  <text class="label" x="902" y="372">Load Balancer</text>
  <text class="small" x="902" y="403">Distributes traffic</text>

  <rect class="box server" x="1140" y="230" width="190" height="104"/>
  <text class="label" x="1182" y="272">Web Server</text>
  <text class="small" x="1171" y="303">Serves web page</text>

  <rect class="box server" x="1140" y="475" width="190" height="104"/>
  <text class="label" x="1162" y="517">Application Server</text>
  <text class="small" x="1170" y="548">Generates page</text>

  <path class="db" d="M662 604 C662 579 830 579 830 604 L830 684 C830 709 662 709 662 684 Z"/>
  <ellipse class="db" cx="746" cy="604" rx="84" ry="25"/>
  <text class="label" x="703" y="647">Database</text>
  <text class="small" x="684" y="675">Returns data</text>

  <path class="dns" d="M230 170 C264 132 282 132 320 152"/>
  <text class="step" x="238" y="128">1. DNS query: www.google.com?</text>

  <path class="dns" d="M510 158 L610 158"/>
  <text class="step" x="525" y="145">2. lookup</text>

  <path class="dns" d="M610 188 L510 188"/>
  <text class="step" x="522" y="212">3. server IP</text>

  <path class="dns" d="M320 192 C276 236 250 236 230 212"/>
  <text class="step" x="242" y="252">4. IP returned to browser</text>

  <path class="tls" d="M230 222 C272 280 285 319 320 362"/>
  <text class="step" x="90" y="306">5. HTTPS request to server IP:443</text>
  <text class="step" x="92" y="327">TCP connection + TLS encryption</text>

  <path class="tls" d="M530 382 L610 382"/>
  <text class="step" x="535" y="366">6. encrypted traffic</text>

  <path class="tls" d="M790 382 L870 382"/>
  <text class="step" x="802" y="366">7. filtered traffic</text>

  <path class="flow" d="M1060 365 C1100 330 1108 300 1140 286"/>
  <text class="step" x="1068" y="332">8. choose backend</text>

  <path class="flow" d="M1235 334 L1235 475"/>
  <text class="step" x="1248" y="412">9. dynamic page work</text>

  <path class="flow" d="M1140 540 C1030 620 940 640 830 640"/>
  <text class="step" x="932" y="614">10. application requests data</text>

  <path class="return" d="M662 672 C910 740 1110 650 1190 579"/>
  <text class="step" x="850" y="718">11. data returned to application server</text>

  <path class="return" d="M1196 475 L1196 334"/>
  <text class="step" x="1040" y="456">12. generated page</text>

  <path class="return" d="M1140 268 C950 120 470 70 155 145"/>
  <text class="step" x="650" y="96">13. encrypted HTTPS response with the web page</text>

  <rect x="44" y="690" width="1290" height="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text class="small" x="62" y="720">Required elements shown: DNS resolution, server IP on port 443, encrypted HTTPS/TLS traffic, firewall, load balancer, web server, application server, and database.</text>
</svg>
